services:
  # 1. Backend Web Service (Express API + MongoDB Atlas integration)
  - type: web
    name: dishasetu
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DB_NAME
        value: dishasetu_db

  # 2. Frontend Static Site (Presidency University Campus Navigation UI)
  - type: static
    name: dishasetu-app
    plan: free
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://dishasetu-jx71.onrender.com
      - key: VITE_API_URL
        value: https://dishasetu-jx71.onrender.com
